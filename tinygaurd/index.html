<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d0b">
  <title>TinyGaurd</title>
  <link rel="stylesheet" href="./src/index.css">
</head>
<body>
  <header class="brand">
    <h1 id="title">TinyGaurd</h1>
    <img class="logo" src="./assets/Tinygaurd_logo.svg" alt="TinyGaurd logo">
    <h2 class="slogan">Your digital life, protected.</h2>
    <p class="slogan subtitle">One app for everything security.</p>
  </header>

  <main class="auth-card">
    <form id="signup_form">
      <div class="field-group">
        <label for="email">Email</label>
        <div class="input-wrapper email-wrapper">
          <img class="input-icon" src="./assets/Mail_icon.png" alt="">
          <input
            type="email"
            id="email"
            name="email"
            minlength="11"
            maxlength="40"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrapper password-wrapper">
          <img class="input-icon" src="./assets/Password_icon.png" alt="">
          <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            maxlength="20"
            autocomplete="new-password"
            placeholder="Create a strong password."
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="password_toggle"
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path class="eye-outline" d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
              <circle class="eye-pupil" cx="12" cy="12" r="3"/>
              <path class="eye-slash" d="M3 3 21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="tos-label" for="tos">
        <input type="checkbox" id="tos" name="tos" required>
        <span>
          I agree to the
          <a href="./TOS.html">Terms of Service</a>
          and
          <a href="./privacy_policy.html">Privacy Policy</a>.
        </span>
      </label>

      <button class="submit-button" type="submit">Create account</button>

      <p class="form-message" id="form_message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <a href="./TOS.html">Terms of Service</a>
    <a href="./privacy_policy.html">Privacy Policy</a>
    <a href="./hide_face.html">Hide Face</a>
  </footer>

  <script>
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("password_toggle");
    const signupForm = document.getElementById("signup_form");
    const formMessage = document.getElementById("form_message");

    passwordToggle.addEventListener("click", () => {
      const showPassword = passwordInput.type === "password";

      passwordInput.type = showPassword ? "text" : "password";
      passwordToggle.setAttribute("aria-pressed", String(showPassword));
      passwordToggle.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
      );
    });

    signupForm.addEventListener("submit", (event) => {
      event.preventDefault();
      formMessage.textContent =
        "Your form is valid. Account creation needs to be connected to a secure authentication service.";
    });
  </script>
</body>
</html>
