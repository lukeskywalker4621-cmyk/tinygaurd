<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TinyGaurd</title>
    <link rel="stylesheet" href="src/index.css" type="text/css">
  </head>
  <body>
    <h1 id="title">Tinygaurd</h1>
    <img class="logo" src="./assets/Tinygaurd_logo.svg">
    <h1 class="slogan">Your digital life, protected.</h1>
    <h3 class="slogan">One app for everything security.</h3>
    <div>

      <h3>Email</h3>
      <form class="signin_entry">
        <input
          type="text"
          id="email"
          name="email"
          minlength="11"
          maxlength="40"
          required
          placeholder="you@example.com"
        >

      </form>

      <h3>Password</h3>
      <form class="signin_entry">
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          maxlength="20"
          required
          placeholder="Create a strong password."
        >
      </form>

      <form>
        <label>Agree to the TOS and Privacy Policy</label>
        <input 
          type="checkbox"
          id="tos"
          name="tos"
          required
        >
      </form>

      <button type="submit">Submit</button>
    </div>

    <footer>
      <a href="TOS.html">
        <p>Terms of Service</p>
      </a>
      <a href="privacy_policy.html">
        <p>Privacy Policy</p>
      </a>
      <a href="hide_face.html">
        <p>hide face</p>
      </a>
    </footer>
    </footer>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
